name: sweep

# 每次 push / 手动 / 每天定时跑一遍全量巡检（订阅清单里有几个模块就查几个）：
#   - 结果表格写进 Job Summary，并作为 artifact 留档
#   - 有变化就把 sweep_result.json / sweep_summary.md 提交回仓库（带 [skip ci]，不自触发）
# 注意：Runner 在海外，被墙站点在这里往往反而通，与本地结果对照看更准。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'sweep_result.json'
      - 'sweep_summary.md'
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *' # 每天 04:00 (UTC+8)

permissions:
  contents: write

concurrency:
  group: sweep # 全局同一时间只跑一个，避免多个 run 抢 push
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 环境检查
        run: |
          node --version
          curl --version | head -1

      - name: 跑全量巡检
        continue-on-error: true
        run: |
          node sweep.mjs --json=sweep_result.json --md=sweep_summary.md

      - name: 上传结构化结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-result
          path: |
            sweep_result.json
            sweep_summary.md
          if-no-files-found: warn

      - name: 提交结果变化
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          if [ ! -f sweep_result.json ]; then
            echo "没有生成结果，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "结果无变化"
            exit 0
          fi
          git commit -m "chore(sweep): 自动更新巡检结果 [skip ci]"
          # 与远端同步后再推；并发/竞态时最多重试 3 次
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送失败，5 秒后重试"
            sleep 5
          done
          echo "推送重试 3 次仍失败（不视为任务失败）"
